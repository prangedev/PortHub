name: porthub
description: "PortHub — launcher estilo Big Picture para ports open source distribuídos pelo GitHub."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.5

  # Rede / GitHub
  http: ^1.6.0

  # Banco local (sqflite no Android, FFI no desktop)
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6

  # Arquivos, hashes e extração
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  archive: ^4.0.7
  yaml: ^3.1.3

  # UI
  cached_network_image: ^4.0.0
  flutter_markdown_plus: ^1.0.3
  url_launcher: ^6.3.1

  # Desktop: tela cheia e controles
  window_manager: ^0.5.0
  gamepads: ^0.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
